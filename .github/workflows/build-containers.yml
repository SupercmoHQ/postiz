---
# koro fork: single-arch (amd64) build pushing to this org's GHCR. Upstream builds
# amd64+arm64 + a manifest; our Postiz host is x86_64-only, so we keep it simple.
name: "Build Containers"

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and Push Image (amd64)
        env:
          CONTAINERVER: ${{ github.ref_name }}
          NEXT_PUBLIC_VERSION: ${{ github.ref_name }}
        run: |
          docker buildx build --platform linux/amd64 \
            -f Dockerfile.dev \
            -t ghcr.io/supercmohq/postiz:${CONTAINERVER} \
            -t ghcr.io/supercmohq/postiz:latest \
            --build-arg NEXT_PUBLIC_VERSION=${NEXT_PUBLIC_VERSION} \
            --pull --no-cache \
            --provenance=false --sbom=false \
            --push .
